<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Blogs</title>
<meta name="description" content="Hands-on write-ups on observability, OpenSearch, Kafka, and cloud-native infrastructure.">
<script>var t="dark";try{t=localStorage.getItem("theme")||"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t)</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=8">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img class="brand-logo" src="assets/logo.svg" alt="" width="30" height="30"><span>Mohiadeen Ameer</span></a>
    <nav class="nav">
      <a href="#posts">Posts</a>
      <a href="about.html">About</a>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 class="sr-only">Tech Blogs</h1>
  <section class="toolbar toolbar-top" id="posts">
    <label class="search">
      <span class="sr-only">Search posts</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search posts, tags, topics…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips"></div>
  </section>

  <div class="section-label" id="listLabel">Latest</div>
  <div class="grid" id="grid"><p class="empty">Loading posts…</p></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="year"></span> Mohiadeen Ameer</span>
    <span class="foot-links"><a href="https://www.linkedin.com/in/mohiadeen-ameer/" target="_blank" rel="noopener">LinkedIn</a><a href="https://github.com/mohiadeen-ameer" target="_blank" rel="noopener">GitHub</a><a href="https://medium.com/@mohiadeen-ameer" target="_blank" rel="noopener">Medium</a></span>
  </div>
</footer>

<script src="assets/common.js?v=8"></script>
<script>
(function () {
  document.getElementById("year").textContent = new Date().getFullYear();
  var grid = document.getElementById("grid");
  var chipsEl = document.getElementById("chips");
  var q = document.getElementById("q");
  var label = document.getElementById("listLabel");
  var all = [], activeTag = new URLSearchParams(location.search).get("tag") || "all";

  function splitTitle(t) {
    var i = t.indexOf(": ");
    if (i < 0) return '<h2 class="card-title">' + esc(t) + "</h2>";
    return '<h2 class="card-title">' + esc(t.slice(0, i)) + "</h2>" +
      '<p class="card-subtitle">' + esc(t.slice(i + 2)) + "</p>";
  }

  function card(p, featured) {
    var isNew = (Date.now() - new Date(p.date + "T00:00:00")) / 864e5 < 14;
    return '<a class="card' + (featured ? " featured" : "") + '" href="post.html?p=' + encodeURIComponent(p.slug) + '">' +
      '<div class="card-meta">' + (isNew ? '<span class="new-pill">NEW</span>' : "") +
        "<span>" + formatDate(p.date) + "</span>" +
        (p.readTime ? "<span>·</span><span>" + esc(p.readTime) + " read</span>" : "") +
        difficultyBadge(p.difficulty) + "</div>" +
      splitTitle(p.title) +
      '<p class="card-desc">' + esc(p.description) + "</p>" +
      '<div class="card-foot"><div class="tags">' +
        (p.tags || []).map(function (t) { return '<span class="tag">#' + esc(t) + "</span>"; }).join("") +
      '</div><span class="read-more">Read →</span></div></a>';
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var list = all.filter(function (p) {
      var tagOk = activeTag === "all" || (p.tags || []).indexOf(activeTag) !== -1;
      var hay = (p.title + " " + p.description + " " + (p.tags || []).join(" ")).toLowerCase();
      return tagOk && (!term || hay.indexOf(term) !== -1);
    });
    var filtered = term || activeTag !== "all";
    label.textContent = filtered ? list.length + " result" + (list.length === 1 ? "" : "s") : "Latest";
    if (!list.length) { grid.innerHTML = '<p class="empty" style="grid-column:1/-1">No posts match. Try another search.</p>'; return; }
    grid.innerHTML = list.map(function (p, i) { return card(p, i === 0); }).join("");
  }

  function renderChips() {
    var counts = {};
    all.forEach(function (p) { (p.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
    var tags = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
    if (activeTag !== "all" && !counts[activeTag]) activeTag = "all";
    chipsEl.innerHTML = ['<button class="chip" data-tag="all" aria-pressed="' + (activeTag === "all") + '">all<span class="n">' + all.length + "</span></button>"]
      .concat(tags.map(function (t) {
        return '<button class="chip" data-tag="' + esc(t) + '" aria-pressed="' + (activeTag === t) + '">#' + esc(t) + '<span class="n">' + counts[t] + "</span></button>";
      })).join("");
  }

  chipsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    activeTag = b.getAttribute("data-tag");
    chipsEl.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    render();
  });
  q.addEventListener("input", render);
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape" && document.activeElement === q) { q.value = ""; render(); q.blur(); }
  });

  loadPosts().then(function (posts) {
    all = posts;
    if (!all.length) { grid.innerHTML = '<p class="empty" style="grid-column:1/-1">No posts yet — add one to posts.json.</p>'; return; }
    renderChips(); render();
  }).catch(function () {
    grid.innerHTML = '<p class="empty" style="grid-column:1/-1">Could not load posts.json. If you opened this file directly, run a local server (see README).</p>';
  });
})();
</script>
</body>
</html>
